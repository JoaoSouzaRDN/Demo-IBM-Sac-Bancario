<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDN Bank · SAC Inteligente</title><link rel="stylesheet" href="style.css"><style>.shell{max-width:1100px;grid-template-columns:1fr}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 250px;flex:1;min-height:0}.checklist{border-left:1px solid #273250;padding:34px 22px;color:#8d9abc;font-size:13px}.checklist b{display:block;color:#fff;margin-bottom:24px}.check{padding:0 0 24px}.check i{display:inline-block;width:10px;height:10px;border:1px solid #61749e;border-radius:50%;margin-right:9px}.check.active{color:#fff;font-weight:600}.check.active i{background:#4f46e5}@media(max-width:760px){.workspace{grid-template-columns:1fr}.checklist{display:none}}</style></head><body><main class="shell"><section class="chat"><header><div><span class="status"></span><b>RDN Bank</b><small>SAC Inteligente · GPT-5.4</small></div><button id="reset">Novo atendimento</button></header><div class="workspace"><div id="messages" class="messages"></div><aside class="checklist"><b>Andamento</b><div class="check active"><i></i>Entendendo sua solicitação</div><div class="check"><i></i>Consultando dados</div><div class="check"><i></i>Aplicando regras</div><div class="check"><i></i>Preparando resposta</div></aside></div><div class="suggestions" id="suggestions"></div><form id="form"><input id="input" placeholder="Descreva o que aconteceu…" autocomplete="off"><button>Enviar</button></form><footer>RDN Bank · Atendimento digital</footer></section></main><script src="chat.js"></script></body></html>
