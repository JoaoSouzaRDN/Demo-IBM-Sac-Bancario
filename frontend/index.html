<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDN Bank · SAC Inteligente</title><link rel="stylesheet" href="style.css"><style>body{background:#0b0d12;color:#f5f5f5}.shell{width:100%;max-width:1200px;display:block;background:#111318}.chat{min-height:100vh}.chat header{padding:18px 6%;background:#111318;border-color:#2b2d35}.chat header small{display:none}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:calc(100vh - 150px)}.messages{padding:34px 8%;min-width:0}.msg{max-width:680px;width:fit-content}.agent{background:#1d2028;border-color:#383c47}.suggestions{padding:0 8% 16px;background:#111318}.suggestions button{background:#171a21;border-color:#767b8c;color:#f0f1f5}.chat form{padding:14px 8%;background:#111318;border-color:#2b2d35}.chat input{background:#171a21;border-color:#494d59}.chat form button{background:#7c3aed}.checklist{border-left:1px solid #2b2d35;padding:34px 22px;color:#a7abb8}.checklist b{color:#fff}.check{padding:0 0 24px}.check i{display:inline-block;width:10px;height:10px;border:1px solid #858b9a;border-radius:50%;margin-right:9px}.check.active{color:#fff;font-weight:600}.check.active i{background:#8b5cf6;border-color:#a78bfa}@media(max-width:700px){.workspace{display:block;min-height:calc(100vh - 150px)}.checklist{display:none}.messages{padding:28px 6%}.suggestions,.chat form{padding-left:6%;padding-right:6%}.msg{max-width:92%}}
</style></head><body><main class="shell"><section class="chat"><header><div><span class="status"></span><b>RDN Bank</b><small>SAC Inteligente</small></div><button id="reset">Novo atendimento</button></header><div class="workspace"><div id="messages" class="messages"></div><aside class="checklist"><b>Andamento</b><div class="check active"><i></i>Entendendo sua solicitação</div><div class="check"><i></i>Consultando dados</div><div class="check"><i></i>Aplicando regras</div><div class="check"><i></i>Preparando resposta</div></aside></div><div class="suggestions" id="suggestions"></div><form id="form"><input id="input" placeholder="Descreva o que aconteceu…" autocomplete="off"><button>Enviar</button></form></section></main><script src="chat.js"></script></body></html>
